apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service

          image: ajay786909/order-service:v1

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: PORT
              value: "5000"

            - name: KAFKA_BROKER
              value: "kafka:9092"

            - name: MONGO_URI
              value: "mongodb+srv://ajaykeswani10:developer@ecommerce-cluster.5pywlf5.mongodb.net/orderdb?appName=ecommerce-cluster"